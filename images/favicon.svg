<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradient for a smooth, glowing night look -->
    <linearGradient id="moonStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g fill="url(#moonStarGrad)" filter="url(#glow)">
    <!-- Crescent Moon -->
    <path d="M 45 15 
             A 35 35 0 1 0 80 72 
             A 30 30 0 1 1 45 15 Z" />

    <!-- 5-Pointed Star -->
    <polygon points="72,20 75,29 84,29 77,34 79,43 72,38 65,43 67,34 60,29 69,29" />
  </g>
</svg>