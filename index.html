<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mission Al Noor</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400&display=swap"
    />
    <style>
      :root {
        --bg: #e6f8d1;
        --s: #d6ebc3;
        --a: #d6ebc3;
        --t: #232820;
        --m: #3f4d33;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        scrollbar-gutter: stable;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: calc(
          100vh - env(safe-area-inset-top, 0px) -
            env(safe-area-inset-bottom, 0px)
        );
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--t);
        font:
          400 1rem/1.7 "Google Sans",
          "Google Sans Flex",
          "IBM Plex Sans Arabic",
          system-ui,
          sans-serif;
      }
      a {
        color: inherit;
        text-underline-offset: 3px;
      }
      main a,
      footer a,
      .brand {
        border-radius: 0.5rem;
        transition: background 0.15s;
      }
      main a {
        padding: 0.1rem 0.35rem;
        margin: 0 -0.35rem;
      }
      main a:hover {
        background: var(--a);
      }
      .card a:hover,
      .founder a:hover {
        background: var(--bg);
      }
      footer a {
        padding: 0.1rem 0.4rem;
      }
      footer a:hover,
      .brand:hover {
        background: var(--bg);
      }
      header {
        background: var(--a);
        color: var(--t);
        text-align: center;
        padding: 1.2rem clamp(1rem, 4vw, 3rem) 0;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--a);
        z-index: 30;
      }
      #bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--a);
        padding: 0.8rem clamp(1rem, 4vw, 3rem);
        transition: box-shadow 0.2s;
      }
      #bar.stuck {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
      }
      #bar .row {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .bb {
        font-weight: 600;
        font-size: clamp(1.35rem, 6vw, 2rem);
        line-height: 1.2;
        text-decoration: none;
        padding: 0.2rem 0.6rem;
        margin-left: -0.6rem;
        border-radius: 0.7rem;
        transition: background 0.15s;
      }
      .bb:hover {
        background: var(--bg);
      }
      .brand {
        font-size: clamp(1.7rem, 6vw, 2.2rem);
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        line-height: 1.2;
        padding: 0.1rem 0.8rem;
        border-radius: 0.7rem;
      }
      .tag {
        background: var(--a);
        color: var(--m);
        font-size: clamp(0.85rem, 2.4vw, 1.15rem);
        margin: 0;
        text-align: center;
        padding: 0.2rem clamp(1rem, 4vw, 3rem) 0;
      }
      .tag span {
        white-space: nowrap;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.25rem 0.5rem;
      }
      #mb {
        display: none;
        border: 0;
        border-radius: 999px;
        background: var(--bg);
        color: var(--t);
        font: inherit;
        font-weight: 500;
        padding: 0.45rem 1.2rem;
        cursor: pointer;
        transition: background 0.15s;
      }
      #mb:hover {
        background: var(--s);
        outline: 2px solid var(--bg);
      }
      @media (max-width: 45.99rem) {
        header {
          display: none;
        }
        #bar {
          order: -2;
          padding: 0.6rem 1rem;
        }
        .tag {
          order: -1;
          text-align: left;
          padding: 0 1rem 0.9rem;
        }
        #bar .row {
          display: flex;
        }
        #mb {
          display: inline-block;
        }
        nav {
          display: none;
          flex-direction: column;
          margin-top: 0.6rem;
          max-height: calc(100vh - 6rem);
          overflow: auto;
        }
        nav.open {
          display: flex;
        }
        nav a {
          text-align: center;
          padding: 0.55rem 0.7rem;
        }
      }
      #up {
        position: fixed;
        right: max(1rem, env(safe-area-inset-right, 0px));
        bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
        width: 3rem;
        height: 3rem;
        border: 2px solid var(--a);
        border-radius: 50%;
        background: var(--a);
        color: var(--t);
        font: inherit;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          background 0.15s;
      }
      #up.on {
        opacity: 1;
        pointer-events: auto;
      }
      #up:hover {
        background: var(--bg);
      }
      nav a {
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 500;
      }
      nav a.on,
      nav a:hover {
        background: var(--bg);
        color: var(--t);
      }
      main::after {
        content: "";
        display: block;
        clear: both;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: 56rem;
        margin: 0 auto;
        padding: 2rem clamp(1rem, 4vw, 2rem) 3rem;
      }
      h1 {
        font-size: clamp(1.35rem, 4vw, 1.8rem);
        line-height: 1.2;
        margin: 0.2rem 0 1rem;
      }
      h2 {
        font-size: 1.25rem;
        margin: 2rem 0 0.5rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr;
        margin: 1.5rem 0;
      }
      @media (min-width: 46rem) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .vid {
        aspect-ratio: 16/9;
        width: 100%;
        border: 0;
        border-radius: 1rem;
        background: var(--s);
        display: block;
      }
      .banner {
        float: left;
        width: min(16rem, 40%);
        height: auto;
        border-radius: 1rem;
        margin: 0.3rem 1.5rem 1rem 0;
      }
      .v {
        margin: 1.5rem 0;
      }
      .v h2 {
        margin-top: 0;
      }
      .card {
        background: var(--a);
        border-radius: 1rem;
        padding: 1.2rem;
      }
      .card h2 {
        margin-top: 0;
      }
      main a.btn {
        display: inline-block;
        background: var(--bg);
        border: 2px solid var(--bg);
        border-radius: 999px;
        padding: 0.55rem 1.3rem;
        margin: 0;
        font-weight: 500;
        text-decoration: none;
      }
      .card a.btn:hover,
      .founder a.btn:hover {
        background: var(--a);
        border-color: var(--t);
      }
      .founder {
        display: grid;
        grid-template-columns: 25% 1fr;
        gap: 1.2rem;
        align-items: stretch;
        background: var(--a);
        border-radius: 1rem;
        padding: 1.2rem;
      }
      .ph {
        position: relative;
        min-height: 9rem;
        border-radius: 1rem;
        background: var(--bg);
        color: var(--t);
        display: grid;
        place-items: center;
        font-weight: 600;
        overflow: hidden;
      }
      .ph img + span {
        display: none;
      }
      .ph img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
      }
      .founder > div:last-child {
        min-width: 0;
      }
      @media (max-width: 45.99rem) {
        .founder {
          grid-template-columns: 1fr;
        }
        .ph {
          align-self: start;
          min-height: 0;
          aspect-ratio: 1 / 1;
        }
      }
      ul {
        padding-left: 1.2rem;
      }
      li {
        margin: 0.4rem 0;
      }
      .list a {
        display: block;
        margin: 0;
        padding: 0.8rem 0.6rem;
        border-bottom: 1px solid var(--a);
        text-decoration: none;
        font-weight: 500;
      }
      .ur {
        direction: rtl;
        text-align: right;
        line-height: 2.1;
      }
      .muted {
        color: var(--m);
      }
      .crumb {
        display: inline-block;
        margin-bottom: 1rem;
      }
      footer {
        background: var(--a);
        padding: 1.5rem clamp(1rem, 4vw, 3rem);
        text-align: center;
        color: var(--t);
        font-weight: 500;
      }
      p,
      li,
      h1,
      h2 {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <header><a class="brand" href="#home">Mission Al Noor</a></header>
    <p class="tag">
      <span>Tariqat our Way ·</span> <span>Shariat our Objectives ·</span>
      <span>Khidmat our Mission</span>
    </p>
    <div id="bar">
      <div class="row">
        <a class="bb" href="#home">Mission Al Noor</a
        ><button id="mb" aria-label="Menu" aria-expanded="false">
          ☰ Menu
        </button>
      </div>
      <nav id="nav"></nav>
    </div>
    <main id="main"></main>
    <footer>
      Mission Al Noor International ·
      <a href="mailto:info@mission-alnoor.org">info@mission-alnoor.org</a>
    </footer>
    <button id="up" aria-label="Scroll to top">↑</button>
    <script>
      var N = [
        ["home", "Home"],
        ["founder", "Founder"],
        ["tariqat", "Tariqat"],
        ["shariat", "Shariat"],
        ["khidmat", "Khidmat"],
        ["articles", "Articles"],
        ["location", "Location"],
      ];
      var A = [
        {
          id: "dua",
          t: "Dua for Magfira",
          h: `<p>O Allah,<br>On the Day of Judgment, in the great plain of Qiyamah, let not even a single sin be written in my book of deeds.</p><p>O Most Merciful Lord,<br>Forgive all my sins, those done openly and those done in secret.<br>Pardon my small and great mistakes.<br>Fill my record with righteous deeds.</p><p>O Lord of all the worlds,<br>On the Day when people will tremble in fear,<br>When no soul will benefit another,<br>Grant me a place under the shade of Your mercy.<br>Make my reckoning easy.<br>Do not disgrace me.<br>Grant me a good and blessed end.<br>Indeed, You are the Most Merciful of all who show mercy.<br>Ameen.</p><p class="ur" lang="ur">اے اللہ!<br>روزِ قیامت کے میدان میں میرے اعمال نامے میں ایک بھی گناہ لکھا ہوا نہ ہو۔<br>اے پروردگارِ مہربان!<br>میرے تمام ظاہر و باطن کے گناہوں کو معاف فرما دے۔<br>میرے چھوٹے بڑے سب قصور بخش دے۔<br>میرے اعمال نامے کو نیکیوں سے بھر دے۔<br>اے رب العالمین!<br>جس دن لوگ خوف سے کانپ رہے ہوں گے،<br>جس دن کوئی کسی کے کام نہ آئے گا،<br>اس دن مجھے اپنی رحمت کے سائے میں جگہ عطا فرما۔<br>میرا حساب آسان فرما۔<br>مجھے رسوا نہ کرنا۔<br>میرا خاتمہ بالخیر فرما۔<br>بے شک تو سب سے زیادہ رحم کرنے والا ہے۔<br>آمین۔</p>`,
        },
        {
          id: "hadees",
          t: "Hadees: To Whom Sovereignty Belongs",
          h: `<p>[40:16] Sura Ghafir</p><p>The Day they come forth, nothing concerning them will be concealed from Allah. To whom belongs [all] sovereignty this Day? To Allah, the One, the Prevailing.</p><p>Wassalam<br>Ashhadu an la ilaha illallah, Astaghfirullah<br>Nas’alukal Jannata wa na’udhu bika minan Naar<br>Allahumma innaka Afuwwun<br>Tuhibbul afwa fa’fu anna ya Karim</p><p>Mohammed Nurul Alam, Ph.D.<br>Associate Professor (Accounting)<br>MBA Accounting Coordinator<br>Canadian University of Dubai</p>`,
        },
        {
          id: "madinah",
          t: "Beloved Shaikh in Madinah Munawarah",
          h: `<p>Dear Brothers and Sisters,</p><p>Beloved Shaikh is in Madinah Tun Nabi (Sallallahu Alayhi Wasallam) and offered Dua for all of us in Masjid e Nabawi.</p>`,
        },
        {
          id: "umrah",
          t: "Beloved Shaikh Performs Umrah",
          h: `<h2>Reached Makkah safely</h2><p>Mission Alnoor International (Headquarters), Lahore, Pakistan.</p><p>Alhamdulillah, Beloved Sheikh Dr. Mohammad Nurul Alam arrived in Makkah safely. Contact number: +966502541038</p><p>Khalid Ayaz Khan, humble worker of Mission Alnoor International, Lahore, Pakistan.</p><h2>On his way to Madinah</h2><p>By the Rahma of Allah Karim, Beloved Shaikh Dr. Mohammed Nurul Alam is on his way to Madinah Munawarah.</p><h2>Umrah performed</h2><p>Alhamdulillah, by the Rahma of Allah Karim, Beloved Shaikh performed Umrah along with our blessed sister Nargis Ara Begum, Dr. Jawad, Dr. Rashed and Dr. Ali and their families. Today he will set out for Madinah Munawarah along with Dr. Ali.</p>`,
        },
        {
          id: "book",
          t: "The Book Authored by Beloved Shaikh",
          h: `<p>Dear Brothers and Sisters,</p><p><a href="https://www.amazon.ca/Empowering-Small-Entrepreneurs-Islamic-Banks/dp/3838312414">Empowering Small Entrepreneurs by Islamic Banks: A study of lender-borrowers network relationships between small entrepreneurs and different financing organizations</a></p><p>“Small and cottage industries play a significant role in solving unemployment problems and enhancing economic growth in all underdeveloped and developing countries of the world. In spite of its exceptional contribution, this sector of economy is mainly plagued by multiple financing problems. This book endeavours to offer solutions to such problems by encompassing various aspects about the financing of rural-based small and cottage industries in different countries like Bangladesh, Sudan, Turkey and Cyprus with special emphasis on the role of Islamic banks.”</p><p>Members who intend to buy a copy for their record may buy directly or through the author. An author who orders more than one copy receives a discount. Anyone who wishes to buy may send the amount to Dr. Mohammed Nurul Alam, who will place the order with the publisher and send the book on delivery.</p><p>This is the first publication from the cycle of our Mission Al Noor. Mashallah, the book relates to Islamic banks. Many of you will be interested to have a look.</p><p>Khalid Ayaz Khan, humble worker of Mission Alnoor<br>khalidayaz1963@hotmail.com</p>`,
        },
        {
          id: "award",
          t: "Outstanding Research Award for Beloved Shaikh",
          h: `<p>A congratulation message from the Institute of Business and Finance Research (IBFR).</p><p>Alhamdulillah, Beloved Shaikh is pleased to inform all brothers and sisters of Mission Al Noor that, by the Rahma of Allah Rabbul Alamin, the Institute of Business and Finance Research honored him with the Outstanding Research Award for his paper “Interest-Free Micro Credit: A Tool for Promoting Different Network Relationships.”</p><p>The award was given at the Global Conference on Business and Finance Award Banquet at Ramada Plaza Herradura, San Jose, Costa Rica, on May 30, 2008. Executive director Mercedes Jalbert congratulated the winners.</p><p>Participants came from more than 72 countries. 136 papers were presented, and 19 percent of the papers submitted received the Outstanding Research Award. His paper will be published in the Global Journal of Business Research (ISSN 1931-0277), distributed through EBSCOhost in over 70 countries.</p><p>Beloved Shaikh thanks all members for their Dua. May Allah bless you all. Ameen.</p><p>Khalid Ayaz Khan, Secretary General, Mission Al Noor (H.Qtrs.), Lahore, Pakistan.</p>`,
        },
      ];
      var O = ["award", "book", "dua", "hadees", "umrah", "madinah"];
      A.sort(function (x, y) {
        return O.indexOf(x.id) - O.indexOf(y.id);
      });
      function list(n) {
        return (
          '<div class="list">' +
          A.slice(0, n)
            .map((a) => '<a href="#' + a.id + '">' + a.t + "</a>")
            .join("") +
          "</div>"
        );
      }
      function vid(id, t) {
        return (
          '<div class="v"><h2>' +
          t +
          '</h2><iframe class="vid" src="https://www.youtube-nocookie.com/embed/' +
          id +
          '" title="' +
          t +
          '" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>'
        );
      }
      var IMG =
        '<img class="banner" src="tsk.jpg" alt="Tariqat, Shariat and Khidmat" onerror="this.remove()">';
      var P = {
        home: () =>
          `<h1>Welcome to Mission Al Noor</h1><div class="founder"><div class="ph"><img src="pp.jpg" alt="" onerror="this.remove()"><span>MNA</span></div><div><h2 style="margin-top:0">Founder and Patron: Prof. Dr. Mohammed Nurul Alam</h2><p>Professor of Accounting at Yorkville University in Toronto, Canada. Ph.D. in “Small Business Finance by Islamic Banks” from Lund University, Sweden.</p><p><a class="btn" href="#founder">Read the full profile</a></p></div></div><div class="grid"><div class="card"><h2>Tariqat our Way</h2><p>The TaqwaTalks video series.</p><a class="btn" href="#tariqat">Watch</a></div><div class="card"><h2>Shariat our Objectives</h2><p>The way to the pond: ‘ilm, ‘amal and ikhlas.</p><a class="btn" href="#shariat">Read</a></div><div class="card"><h2>Khidmat our Mission</h2><p>Selfless service as a means to divine favour.</p><a class="btn" href="#khidmat">Read</a></div></div><h2>Featured articles</h2>${list(3)}<p><a href="#articles">More articles</a></p>`,
        founder: () =>
          `<h1>Founder and Patron: Prof. Dr. Mohammed Nurul Alam</h1><p>Dr. Mohammed Nurul Alam is a Professor of Accounting at Yorkville University in Toronto, Canada. He holds a Ph.D. in “Small Business Finance by Islamic Banks” from Lund University in Sweden. His academic background includes a Bachelor of Commerce with Honours, a Master’s Degree in Accounting, and completion of a Chartered Accounting Course (CACC).</p><p>Dr. Alam’s teaching journey dates back to 1976. He has taught accounting to CPA students in Nairobi, Kenya, and collaborated with the United Nations Development Program (UNDP) as a Lecturer in Accounting and Finance at the Kenya Institute of Administration (KIA), Nairobi. He served as an Assistant Professor in Accounting and as Dean of the Commerce Faculty at Islamic University, Bangladesh.</p><p>He coordinated the Federal Government project “Fresh Start,” funded by the Ontario Trillium Foundation, Canada. The project taught women in the Region of Peel how to start small home-based businesses.</p><p>Dr. Alam worked as an Assistant Professor in Accounting at Sultan Qaboos University in Oman. He held the position of Associate Professor at Canadian University in Dubai, UAE, where he taught Managerial Accounting to MBA students. He was a SIDA (Swedish International Development Cooperation Agency) Research Fellow at Lund University, where he conducted research and taught MBA courses on banking in Southeast Asian nations and international marketing.</p><p>He served as a visiting professor at Trisakti University in West Jakarta, Indonesia, in the Department of Islamic Economics and Finance, where he developed and taught a PhD course on Small Business Finance by Islamic Banks and Networking. He conducted his PhD research by visiting Islamic banks in Kuwait, Saudi Arabia, Sudan, Turkey, Northern Cyprus, Pakistan and Bangladesh.</p><p>He has presented his work on “Small Entrepreneurs Finance by Islamic Banks” at international conferences in over 20 countries and published numerous articles in international journals. His 2009 book “Empowering Small Entrepreneurs by Islamic Banks” is available on Amazon. He awaits publication of his latest book, “Islamic Banking: Financial Practices,” which examines Riba and other financial practices within Islamic banking. His most recent presentation was at the United Nations Headquarters in Geneva, where he discussed the role of Islamic banks in financing small businesses in Kenya.</p><p>Described in one word, he is “wanderlust.” As Shakespeare said, “The world is my oyster.” He has traveled to over 42 countries.</p><h2>Links</h2><ul><li><a href="https://myyu.ca/faculty/mohammed-alam/">Yorkville University faculty page</a></li><li><a href="https://www.amazon.ca/Empowering-Small-Entrepreneurs-Islamic-Banks/dp/3838312414">Book on Amazon</a></li><li><a href="https://lup.lub.lu.se/search/publication/da34de11-6080-4432-a2cd-fedc6ebd6347">Lund University: Financing of Small and Cottage Industries in Bangladesh by Islamic Banks</a></li><li><a href="cv.pdf">Download complete CV</a></li></ul><h2>Conferences</h2>${vid("v3lbM0vnv8U", "WASD online conference, London, October 18 to 19, 2020: Online Learning the New Normal Post Covid-19")}${vid("Ns1e6iOGNBo", "United Nations Environment Program, London, June 2019: Islamic banking financing to SME (with Nurulayn Binte Noor)")}${vid("M5AkrvKUikg", "United Nations HQ, Geneva, April 11, 2018: Coalescing the energies of SMEs (with his daughter Nurulayn Binte Noor)")}${vid("jwlCad44-iE", "Canary Wharf, London, July 2016: Small entrepreneurs finance by Islamic Banks, an empirical review")}`,
        tariqat: () =>
          `<h1>Tariqat our Way</h1><p class="muted">TaqwaTalks series</p>${vid("5q61f7Bk3R4", "Part 1. TaqwaTalks Series Introduction")}${vid("SObPCXfLz6Y", "Part 2. The Importance of Sabr (Patience) During Prayers")}${vid("FRoB6064fZ8", "Part 3. The Significance of Islam, Imaan and Ehsaan")}`,
        shariat: () =>
          `<h1>Shariat our Objectives</h1>${IMG}<p>Linguistically, Shari’a means the way or the path to the pond. It is the route the traveller must tread to quench his thirst and assure the safety of his flock. Like water, the Shari’a is both internal and external to the human condition. It constitutes the human soul and nourishes the soul. ‘Aisha bint Abi Bakr (may Allah be well-pleased with them both) said, “The demeanor of the Prophet [peace and blessings be upon him] was the Qur’an” (kana khuluquhu al-Qur’an). Quranic injunctions were the Messenger’s sacred nature. The Shari’a was his fitra.</p><p>The Mujaddid Alf-i Thani, Shaykh Ahmad Sirhindi, writes in one of his letters (maktubat) that the Shari’a has three parts: ‘ilm (knowledge), ‘amal (practice) and ikhlas (sincerity). Attaining Shari’a depends on realizing these three. Without knowledge, practice is impeded. Without sincerity, both are misguided.</p><p>He continues that tariqa and haqiqa (the attainment of a level of consciousness and spirituality in full realization of Allah’s all-encompassing existence) both belong to the third element, ikhlas. Tariqa is therefore an indispensable precondition for attaining Shari’a. The single objective of tariqa is to facilitate Shari’a on the individual and social levels.</p><p>The people of tariqa are the people of Shari’a. During the sojourn of the spiritual wayfarer, the inner wisdoms of the outer norms become apparent. The ultimate aim is rida (contentment with Allah’s commands), the final destination of both suluk (being preoccupied with Allah) and jazb (being absorbed in Allah).</p>`,
        khidmat: () =>
          `<h1>Khidmat our Mission</h1>${IMG}<p>Khidmat is the Persian, and thus Urdu, equivalent of the Arabic Khidma, which means selfless service. The Prophetic hadith explains khidmat as a means to divine favour: “Allah is in the assistance of His servant as long as His servant is in the assistance of others” (Sahih Muslim). The scholars of the inward insist the degree of Allah’s assistance (‘awn or nusra) reflects the ikhlas, the sincerity and purity of intention, in serving the other. Ikhlas relates to seeking the Creator’s favour, not reciprocal or future favour from His creation, and not ostentation (riya).</p><p>To serve a fellow human being, one must first know his or her needs. Such knowledge comes from companionship, nearness and affection. The khadim must at least be approachable, though this is a lesser rank than persistently asking after and caring for the welfare of others.</p><p>Beyond safeguarding the temporal and spiritual wellbeing of friends and acquaintances, he who seeks divine grace through service to humanity will, as a religious duty, seek out the less fortunate: the needy, the orphans, the widowed, the oppressed, and those whose religious rank is a means to divine pleasure and proximity. Khidmat is at the heart of tariqa and is understood as disseminating grace as a means to increase grace.</p><p>Shaykh Abdal Qadir al-Jilani (may Allah sanctify his secret) related that shukr, thankfulness to Allah, is expressed by three means: shukr of the tongue, of the heart and of the limbs. The latter is expressed through khidma.</p><p>His spiritual heir, Shaykh al-Akbar Muhyiuddin Ibn ‘Arabi (may Allah sanctify his secret), in his work Ruh al-Quds, chides those Sufis who avoid khidma, for Sufism without khidma is motion without movement. Shaykh Sa’adi sums up in a Persian couplet: ‘Ibadat bajuz khidmat-e khalq neest. Worship without service of mankind comes to naught.</p>`,

        articles: () =>
          `<h1>Latest Articles and Programs</h1>${list(99)}<p class="muted">Older posts will appear here as they are added.</p>`,

      function render() {
        var k = location.hash.slice(1) || "home",
          a = A.find((x) => x.id === k),
          m = document.getElementById("main");
        m.innerHTML = a
          ? '<a class="crumb" href="#articles">← All articles</a><article><h1>' +
            a.t +
            "</h1>" +
            a.h +
            "</article>"
          : (P[k] || P.home)();
        var cur = a ? "articles" : P[k] ? k : "home";
        document.getElementById("nav").innerHTML = N.map(
          (n) =>
            '<a href="#' +
            n[0] +
            '"' +
            (n[0] == cur ? ' class="on"' : "") +
            ">" +
            n[1] +
            "</a>",
        ).join("");
        window.scrollTo(0, 0);
        document.getElementById("nav").classList.remove("open");
        document.getElementById("mb").setAttribute("aria-expanded", "false");
      }
      addEventListener("hashchange", render);
      render();
      var up = document.getElementById("up"),
        mb = document.getElementById("mb");
      mb.onclick = function () {
        var o = document.getElementById("nav").classList.toggle("open");
        mb.setAttribute("aria-expanded", o);
      };
      function sc() {
        up.classList.toggle("on", window.scrollY > 300);
        document
          .getElementById("bar")
          .classList.toggle(
            "stuck",
            document.getElementById("bar").getBoundingClientRect().top <= 0 &&
              window.scrollY > 0,
          );
      }
      addEventListener("scroll", sc);
      sc();
      up.onclick = function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    </script>
